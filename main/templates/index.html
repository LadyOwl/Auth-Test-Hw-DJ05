<!-- index.html -->
{% extends 'base.html' %}

{% block content %}
<h1>Welcome to the Home Page!</h1>
{% if user.is_authenticated %}
    <p>Hello, {{ user.username }}! <a href="{% url 'profile' %}">Go to your profile</a>.</p>
{% else %}
    <p>Please <a href="{% url 'login' %}">log in</a> to access your profile.</p>
{% endif %}
{% endblock %}
